<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial charts · Fictional preview</title></head><body><header><div class="brand">The Key Ahead Investor</div><span>Fictional chart preview · No account connection</span></header><div class="actions"><button id="desktop" type="button">Desktop preview</button><button id="phone" type="button">Narrow preview</button><button id="theme" type="button">Switch theme</button></div><div class="app-shell" id="preview-shell"><nav class="sidebar" aria-label="Preview navigation"><button class="active" type="button">Financial Reports</button></nav><main class="panel"><section class="page current" id="finance"><h1>Financial Reports</h1><p>Fictional recorded transactions demonstrate the charts. Your app uses your saved records and selected filters.</p><div id="charts"></div></section></main></div><script type="module">
import {renderFinanceCharts} from './finance-cpa.mjs';
const html=await (await fetch('./index.html')).text();const source=new DOMParser().parseFromString(html,'text/html');for(const style of source.querySelectorAll('style'))document.head.append(style.cloneNode(true));
const amounts={'2026-05':['2800.00','1850.00'],'2026-06':['2850.00','1920.50'],'2026-07':['2900.00','3400.00'],'2026-08':null,'2026-09':['3000.00','2100.00'],'2026-10':['3000.00','2200.00']};
const report=month=>{const a=amounts[month],entries=a?[['income',a[0],'Rent'],['expense',a[1],'Property costs']].map(([entry_type,amount,category],i)=>({entry_id:'fictional-'+i,company_id:'fictional',deal_id:'fictional-property',property_name:'Fictional duplex',entry_date:month+'-10',entry_type,amount,category,description:'Preview only',vendor_name:'',payment_method:'',account_name:'',tax_treatment:'review',receipt_reference:'',reconciled:false,bookkeeping_notes:''})):[];const net=a?(Number(a[0])-Number(a[1])).toFixed(2):'0.00';return {company_id:'fictional',month,deal_id:null,reconciled:null,tax_treatment:null,entries,totals:{income:a?.[0]||'0.00',expenses:a?.[1]||'0.00',net,count:entries.length,unreconciled:entries.length},categories:a?[{category:'Rent',income:a[0],expenses:'0.00',net:a[0]},{category:'Property costs',income:'0.00',expenses:a[1],net:'-'+a[1]}]:[]};};
await renderFinanceCharts({root:document.getElementById('charts'),selected:report('2026-10'),loadHistory:async(c,f)=>report(f.month)});
document.getElementById('desktop').onclick=()=>{document.getElementById('preview-shell').style.maxWidth='';document.getElementById('preview-shell').style.display='';};document.getElementById('phone').onclick=()=>{document.getElementById('preview-shell').style.maxWidth='390px';document.getElementById('preview-shell').style.display='block';};document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';};
</script></body></html>
