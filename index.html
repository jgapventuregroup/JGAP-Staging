<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JGAP Staging — Deal Analyzer</title>
<style>body{font:16px system-ui,sans-serif;max-width:850px;margin:32px auto;padding:0 18px;background:#f4f7fa;color:#17324a}section{background:white;padding:22px;margin:16px 0;border:1px solid #d5e1ea;border-radius:12px}label{display:block;margin:12px 0 4px}input,select,button{font:inherit;padding:10px;border-radius:7px}input,select{width:100%;box-sizing:border-box;border:1px solid #9aaebf}button{background:#13548c;color:white;border:0;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 18px}.hidden{display:none}.warn{background:#fff3d8;padding:12px;border-left:4px solid #ac7600}output{display:block;white-space:pre-wrap;line-height:1.8}small{color:#536a7a}</style>
</head><body><h1>JGAP Customer Workspace</h1><p><strong>STAGING ONLY</strong> — fictional customer accounts. Not connected to production.</p>
<section><h2>Sign in</h2><label>Staging publishable key</label><input id="key" type="password" autocomplete="off" placeholder="sb_publishable_…"><label>Test customer</label><select id="email"><option value="jgap-test-a@example.com">Customer A — jgap-test-a@example.com</option><option value="jgap-test-b@example.com">Customer B — jgap-test-b@example.com</option></select><label>Password</label><input id="password" type="password"><button id="login">Sign in</button><p id="status" role="status">Not signed in</p></section>
<section id="workspace" class="hidden"><h2>My workspace</h2><label>Company</label><select id="company"></select><h3>Properties</h3><div id="deals"></div><button id="logout">Sign out</button></section>
<section id="analyzer" tabindex="-1"><h2>Deal Analyzer</h2><p id="selected">Manual calculation — not saved</p><div class="grid">
<div><label>Asking price ($)</label><input id="ask" type="number" min="0" value="200000"></div><div><label>Your offer ($)</label><input id="offer" type="number" min="0" value="180000"></div><div><label>Monthly rent ($)</label><input id="rent" type="number" min="0" value="1800"></div><div><label>Other monthly income ($)</label><input id="other" type="number" min="0" value="0"></div><div><label>Vacancy (%)</label><input id="vacancy" type="number" min="0" max="100" value="5"></div><div><label>Monthly operating expenses ($)</label><input id="expenses" type="number" min="0" value="600"></div><div><label>Down payment (%)</label><input id="down" type="number" min="0" max="100" value="20"></div><div><label>Annual interest (%)</label><input id="rate" type="number" min="0" value="7"></div><div><label>Loan years</label><input id="years" type="number" min="1" value="30"></div><div><label>Closing and repair costs ($)</label><input id="costs" type="number" min="0" value="5000"></div></div><button id="calculate">Analyze offer</button><p id="warning" class="warn hidden"></p><output id="results"></output><small>Estimates only. Operating expenses exclude debt service. No data is saved from this analyzer.</small></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),url='https://qfszapteuxuogoselprp.supabase.co';
let client=null,companies=[],companyId='',busy=false;
const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});
const status=s=>$('status').textContent=s;
async function rpc(name,args){const {data,error}=await client.rpc(name,args);if(error)throw error;return data;}
function calculate(){const ids=['ask','offer','rent','other','vacancy','expenses','down','rate','years','costs'];const n={};for(const id of ids){const v=$(id).value.trim();if(!v||!Number.isFinite(+v)||+v<0)throw Error('Enter valid nonnegative numbers in every field');n[id]=+v;}if(n.vacancy>100||n.down>100||n.rate>100||n.years<=0||n.years>50)throw Error('Invalid percentage or loan term');
const warning=[];if(n.expenses===0)warning.push('Operating expenses are zero');if(n.vacancy===0)warning.push('Vacancy is zero');if(n.rate===0&&n.down<100)warning.push('Interest rate is zero');
$('warning').classList.toggle('hidden',!warning.length);$('warning').textContent=warning.length?'Verify assumptions: '+warning.join('; '):'';
const loan=n.offer*(1-n.down/100),months=n.years*12,r=n.rate/1200;
const payment=loan===0?0:r===0?loan/months:loan*r/(1-Math.pow(1+r,-months));
const noi=((n.rent+n.other)*(1-n.vacancy/100)-n.expenses)*12;
const flow=noi/12-payment,invested=n.offer*n.down/100+n.costs;
$('results').textContent=[['Asking price',money(n.ask)],['Offer',money(n.offer)],['Loan',money(loan)],['Monthly payment',money(payment)],['Annual NOI',money(noi)],['Monthly cash flow',money(flow)],['Cap rate',n.offer?(noi/n.offer*100).toFixed(2)+'%':'N/A'],['Cash-on-cash',invested?(flow*12/invested*100).toFixed(2)+'%':'N/A'],['DSCR',payment?(noi/(payment*12)).toFixed(2):'N/A']].map(x=>x.join(': ')).join('\n');}
$('calculate').onclick=()=>{try{calculate()}catch(e){$('results').textContent='Error: '+e.message}};
async function refresh(){if(!companies.some(c=>c.id===companyId))throw Error('Unauthorized company');const rows=await rpc('list_company_deals',{p_company_id:companyId});if(!Array.isArray(rows)||rows.some(d=>d.company_id!==companyId))throw Error('Invalid company response');$('deals').replaceChildren();for(const deal of rows){const line=document.createElement('p'),button=document.createElement('button');line.append(document.createTextNode(deal.name+' — '+money(Number(deal.purchase_price||0))+' '));button.textContent='Analyze';button.onclick=async()=>{try{const r=await rpc('get_company_deal',{p_company_id:companyId,p_deal_id:deal.id}),d=Array.isArray(r)?r[0]:r;if(!d||d.company_id!==companyId||d.id!==deal.id)throw Error('Property unavailable');const mapping={ask:d.asking_price??d.purchase_price,offer:d.target_offer_price??d.purchase_price,rent:d.monthly_rent,other:d.other_monthly_income,vacancy:d.vacancy_rate,expenses:d.monthly_operating_expenses,down:d.down_payment,rate:d.interest_rate,years:d.loan_term_years,costs:(d.closing_costs==null&&d.rehab_cost==null)?null:Number(d.closing_costs||0)+Number(d.rehab_cost||0)};const missing=[];for(const [key,val] of Object.entries(mapping)){if(val==null){missing.push(key);continue;}$(key).value=val;}$('selected').textContent='Analyzing '+d.name+(missing.length?' — missing stored values: '+missing.join(', '):'');calculate();if(missing.length){$('warning').classList.remove('hidden');$('warning').textContent='Some values were not saved for this property: '+missing.join(', ')+'. Remaining inputs may be previous estimates; verify before relying on results.';}button.textContent='Opened ✓';$('analyzer').scrollIntoView({behavior:'smooth'});$('analyzer').focus({preventScroll:true});}catch(e){status('Analyze error: '+e.message)}};line.append(button);$('deals').append(line);}status('Connected — '+rows.length+' properties');}
$('login').onclick=async()=>{if(busy)return;busy=true;$('login').disabled=true;try{const key=$('key').value.trim(),email=$('email').value;if(!key.startsWith('sb_publishable_'))throw Error('Enter a staging publishable key');if(!window.supabase)throw Error('Supabase library unavailable');client=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await client.auth.signInWithPassword({email,password:$('password').value});$('password').value='';if(error)throw error;if(data.user?.email?.toLowerCase()!==email)throw Error('Account mismatch');const rows=await rpc('list_my_companies');companies=(rows||[]).map(x=>({id:x.company_id||x.id,name:x.company_name||x.name,role:x.member_role||x.role}));if(!companies.length)throw Error('No authorized company');$('company').replaceChildren();for(const c of companies){const option=document.createElement('option');option.value=c.id;option.textContent=c.name+' ('+c.role+')';$('company').append(option);}companyId=companies[0].id;$('workspace').classList.remove('hidden');await refresh();}catch(e){status('Sign-in error: '+e.message);$('workspace').classList.add('hidden');if(client)await client.auth.signOut().catch(()=>{});client=null;}finally{busy=false;$('login').disabled=false;}};
$('company').onchange=async()=>{companyId=$('company').value;try{await refresh()}catch(e){status(e.message)}};
$('logout').onclick=async()=>{if(client)await client.auth.signOut();client=null;companies=[];companyId='';$('workspace').classList.add('hidden');$('key').value='';status('Signed out');};
})();
</script></body></html>
