name: Staging app tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      concurrency-postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: jgap_concurrency
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 127.0.0.1:54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jgap_concurrency"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run application tests
        run: npm test
      - name: Install isolated concurrency test driver
        run: python3 -m pip install --disable-pip-version-check psycopg2-binary==2.9.11
      - name: Check competing team transactions on isolated PostgreSQL 17
        run: python3 scripts/test-team-concurrency.py --ci-local
