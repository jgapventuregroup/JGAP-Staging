name: JGAP V1 Verification

on:
  push:
    branches: [main, jgap-v1-clean-build, v1-ci-verification-20261013]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test application and edge functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run application tests
        run: npm test
      - name: Type-check edge functions
        run: npm run check:edge
