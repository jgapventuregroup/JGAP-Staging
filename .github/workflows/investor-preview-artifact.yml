name: Build Investor preview artifact
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify required preview assets
        run: |
          test -f previews/index.html
          test -f previews/property-operations-demo.html
          test -f previews/investor-ledger-demo.html
          test -f original-passport-loader.mjs
          test -f original-passport-display.mjs
          test -f original-passport-forms.mjs
          test -f original-passport-writer.mjs
          test -f original-passport-recovery.mjs
      - name: Package Investor preview
        run: |
          mkdir -p dist/previews
          cp index.html dashboard-customization.mjs money-making-overview.mjs saved-deal-radar.mjs passport-document-live-gate.mjs passport-documents.mjs passport-live-isolation-core.mjs passport-security-gate.mjs finance-cpa.mjs config.js account-recovery.js deal-intelligence-adapter.js deal-intelligence.js lenders.js property-passport.mjs property-passport-preview.mjs property-ledger.mjs property-work.mjs property-operations.mjs property-operations-loader.mjs property-activity-writer.mjs property-activity-forms.mjs original-passport-loader.mjs original-passport-display.mjs original-passport-forms.mjs original-passport-writer.mjs original-passport-recovery.mjs dist/
          cp previews/index.html previews/property-operations-demo.html previews/investor-ledger-demo.html previews/passport-security-gate.html dist/previews/
          node scripts/version-frontend.mjs dist
      - name: Verify bundled Passport module imports resolve
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='dist';
          const queue=['property-passport-preview.mjs','passport-security-gate.mjs'];
          const visited=new Set();
          while(queue.length){
            const relative=queue.shift();
            if(visited.has(relative))continue;
            visited.add(relative);
            const file=path.join(root,relative);
            if(!fs.existsSync(file))throw Error('Missing preview module: '+relative);
            const source=fs.readFileSync(file,'utf8');
            for(const match of source.matchAll(/(?:import|export)\s+(?:[^'\";]*?\s+from\s+)?['\"](\.[^'\"]+)['\"]/g)){
              const dependency=path.posix.normalize(path.posix.join(path.posix.dirname(relative),match[1].split('?')[0]));
              if(!dependency.startsWith('../'))queue.push(dependency);
            }
          }
          console.log('Verified '+visited.size+' bundled Passport modules');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: investor-preview-site
          path: dist/
          retention-days: 7
