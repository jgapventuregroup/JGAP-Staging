name: Isolated Investor V1 browser QA
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: investor-v1-isolated-browser
  cancel-in-progress: false
jobs:
  browser:
    if: github.ref == 'refs/heads/v1-isolated-browser-qa'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: v1-isolated-qa
    steps:
      - name: Verify isolated secret is configured
        env:
          QA_SUPABASE_ADMIN_KEY: ${{ secrets.QA_SUPABASE_ADMIN_KEY }}
        run: 'test -n "$QA_SUPABASE_ADMIN_KEY" || { echo "Missing v1-isolated-qa environment secret QA_SUPABASE_ADMIN_KEY"; exit 1; }'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Run isolated acceptance
        run: node scripts/v1-isolated-browser-qa.mjs
        env:
          QA_SUPABASE_ADMIN_KEY: ${{ secrets.QA_SUPABASE_ADMIN_KEY }}
          QA_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e_HrV8G2s2nW5Q7Gy51a0g__eo_AapO
