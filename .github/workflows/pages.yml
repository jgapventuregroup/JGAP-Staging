name: Publish JGAP staging website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify application
        run: npm test
      - name: Package public frontend only
        run: |
          mkdir -p dist/previews
          cp index.html page-help.mjs page-help.css market-map.mjs leaflet.js leaflet.css leaflet-LICENSE.txt team-controls.mjs in-app-alerts.mjs dashboard-customization.mjs dashboard-grid.mjs dashboard-grid-demo.html gridstack.js gridstack.css gridstack-LICENSE.txt gridstack-all.js.LICENSE.txt money-making-overview.mjs saved-deal-radar.mjs passport-document-live-gate.mjs passport-documents.mjs passport-live-isolation-core.mjs passport-security-gate.mjs finance-cpa.mjs finance-charts-demo.html config.js account-recovery.js deal-intelligence-adapter.js deal-intelligence.js lenders.js property-passport.mjs property-passport-preview.mjs property-ledger.mjs property-work.mjs property-operations.mjs property-operations-loader.mjs property-activity-writer.mjs property-activity-forms.mjs original-passport-loader.mjs original-passport-display.mjs original-passport-forms.mjs original-passport-writer.mjs original-passport-recovery.mjs dist/
          cp previews/passport-security-gate.html dist/previews/
          node scripts/version-frontend.mjs dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
